name: Public Core CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_revit_addin:
        description: "Run Revit add-in build on a Windows runner with Autodesk API references"
        required: false
        default: false
        type: boolean
      run_safe_read_release:
        description: "Run installed-Revit 2023/2024/2025 SafeRead proof and package release gate"
        required: false
        default: false
        type: boolean

jobs:
  architecture:
    name: Architecture Ratchets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend module size ratchet
        shell: pwsh
        run: ./scripts/check_backend_module_size.ps1

  backend:
    name: Backend Build/Test/Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/operator-backend/package-lock.json
      - name: Build sibling MCP server for backend integration tests
        working-directory: apps/mcp-server
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:repo
      - run: npm audit --omit=dev --audit-level=high

  mcp-server:
    name: MCP Build/Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mcp-server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Public Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-secrets.sh

  operator-deploy:
    name: OperatorDeploy Build/Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test packages/operator-deploy/OperatorDeploy.Tests/OperatorDeploy.Tests.csproj -c Release
      - run: dotnet publish packages/operator-deploy/OperatorDeploy/OperatorDeploy.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false

  safe-read-hermetic:
    name: SafeRead Hermetic Security Gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.119
            9.0.304
      - name: Install Pester for PowerShell 7
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5.0
      - name: Install Pester for Windows PowerShell 5.1
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5.0
      - name: Host production-source tests
        shell: pwsh
        run: dotnet test apps/revit-safe-read-host/tests/RevitOperator.SafeReadHost.Tests/RevitOperator.SafeReadHost.Tests.csproj -c Release
      - name: Strict JSON parser vectors on .NET Framework and .NET 8
        shell: pwsh
        run: |
          dotnet run --project apps/revit-safe-read-host/tests/RevitOperator.SafeReadHost.ParserVectors/RevitOperator.SafeReadHost.ParserVectors.csproj -c Release -f net48
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project apps/revit-safe-read-host/tests/RevitOperator.SafeReadHost.ParserVectors/RevitOperator.SafeReadHost.ParserVectors.csproj -c Release -f net8.0-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Proof falsifiers with generated Revit API fixtures
        shell: pwsh
        run: ./apps/revit-safe-read-proof/tests/run.ps1 -Hermetic
      - name: Package security tests on PowerShell 7
        shell: pwsh
        run: |
          $result = Invoke-Pester ./scripts/deploy/tests/SafeReadPackageV2.Pester.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
      - name: Package security tests on Windows PowerShell 5.1
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $result = Invoke-Pester ./scripts/deploy/tests/SafeReadPackageV2.Pester.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  safe-read-installed-revit-release:
    name: SafeRead Installed Revit Release Gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_safe_read_release == true }}
    runs-on: [self-hosted, Windows, revit-certified]
    steps:
      - uses: actions/checkout@v4
      - name: Require all release prerequisites
        shell: pwsh
        run: |
          $required = @(
            'C:\Program Files\dotnet\dotnet.exe',
            'C:\Program Files\Autodesk\Revit 2023\RevitAPI.dll',
            'C:\Program Files\Autodesk\Revit 2023\RevitAPIUI.dll',
            'C:\Program Files\Autodesk\Revit 2024\RevitAPI.dll',
            'C:\Program Files\Autodesk\Revit 2024\RevitAPIUI.dll',
            'C:\Program Files\Autodesk\Revit 2025\RevitAPI.dll',
            'C:\Program Files\Autodesk\Revit 2025\RevitAPIUI.dll'
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count) { throw "SafeRead release runner is missing required files: $($missing -join ', ')" }
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) { throw 'SafeRead release runner requires PowerShell 7.' }
      - name: Host tests and exact three-year builds
        shell: pwsh
        run: |
          dotnet test apps/revit-safe-read-host/tests/RevitOperator.SafeReadHost.Tests/RevitOperator.SafeReadHost.Tests.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project apps/revit-safe-read-host/tests/RevitOperator.SafeReadHost.ParserVectors/RevitOperator.SafeReadHost.ParserVectors.csproj -c Release -f net48
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project apps/revit-safe-read-host/tests/RevitOperator.SafeReadHost.ParserVectors/RevitOperator.SafeReadHost.ParserVectors.csproj -c Release -f net8.0-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build apps/revit-safe-read-host/src/RevitOperator.SafeReadHost/RevitOperator.SafeReadHost.csproj -c Release -f net48 -p:RevitYear=2023 -p:RevitApiPath='C:\Program Files\Autodesk\Revit 2023'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build apps/revit-safe-read-host/src/RevitOperator.SafeReadHost/RevitOperator.SafeReadHost.csproj -c Release -f net48 -p:RevitYear=2024 -p:RevitApiPath='C:\Program Files\Autodesk\Revit 2024'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build apps/revit-safe-read-host/src/RevitOperator.SafeReadHost/RevitOperator.SafeReadHost.csproj -c Release -f net8.0-windows -p:RevitYear=2025 -p:RevitApiPath='C:\Program Files\Autodesk\Revit 2025'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Full installed-Revit proof gate
        shell: pwsh
        run: ./apps/revit-safe-read-proof/tests/run.ps1
      - name: Cross-edition real three-year proof package
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP ('safe-read-cross-edition-package-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $output | Out-Null
          ./scripts/deploy/tests/Invoke-SafeReadCrossEditionPackageFixture.ps1 -RepositoryRoot (Get-Location).Path -OutputRoot $output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  revit-addin:
    name: Revit Add-in Build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_revit_addin == true }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/revit-bridge-addin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build RevitBridge.sln -c Release
